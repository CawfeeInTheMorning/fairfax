<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curiosity Shop</title>
<link rel="icon" type="image/png" href="logo_curiosity.png">
<link rel="stylesheet" href="css/style.css?v=226">
</head>
<body>

<header class="site-header">
  <img class="site-header-logo" src="logo_curiosity_full.png" alt="Curiosity">
  <a class="site-header-credit" href="https://morningcawfee.com" target="_blank" rel="noopener noreferrer">
    <span>Created by Cawfee</span>
    <img src="frontend_assets/logo_cawfee.png" alt="Cawfee">
  </a>
</header>

<div class="shop-layout">
  <div class="category-tabs-viewport">
    <nav class="category-tabs" id="category-tabs">
      <!-- tab buttons injected by app.js -->
      <button id="tab-search" type="button" aria-label="Search">
        <img src="frontend_assets/shop_icon_search.png" alt="">
      </button>
    </nav>
  </div>

  <div id="shop-panels"></div>

  <div class="tooltip-display" id="tooltip-display"></div>
</div>

<div class="shop-builds-wrap">
  <div class="build-tabs-viewport">
    <nav class="build-tabs" id="build-tabs">
      <!-- tab buttons injected by app.js -->
    </nav>
  </div>
  <div class="shop-builds" id="shop-builds"></div>
</div>

<div class="shop-graphs" id="shop-graphs"></div>

<div class="too-small-message">Browser lookin' a bit too small for shoppin, size it up a lil' would yah?</div>

<script src="js/items-data.js?v=23"></script>
<script src="js/curated-builds.js?v=1"></script>
<script src="js/app.js?v=128"></script>
</body>
</html>
