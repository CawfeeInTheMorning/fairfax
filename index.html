<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deadlock Shop Browser</title>
<link rel="stylesheet" href="css/style.css?v=31">
</head>
<body>

<header class="site-header">
  <h1>Deadlock Shop Browser</h1>
  <p>Browse Weapon, Vitality, and Spirit items by tier</p>
</header>

<div class="shop-layout">
  <nav class="category-tabs" id="category-tabs">
    <!-- tab buttons injected by app.js -->
    <button id="tab-search" type="button" aria-label="Search">
      <img src="frontend_assets/shop_icon_search.png" alt="">
    </button>
  </nav>

  <div id="shop-panels"></div>

  <div class="tooltip-display" id="tooltip-display"></div>
</div>

<div class="item-tooltip" id="item-tooltip"></div>

<script src="js/items-data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
